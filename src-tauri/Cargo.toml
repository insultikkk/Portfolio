[package]
name = "still-live-lyrics"
version = "0.1.0"
description = "A quiet desktop companion for SoundCloud"
edition = "2021"
default-run = "still-live-lyrics"

[lib]
name = "still_core"
path = "src/lib.rs"

[[bin]]
name = "still-live-lyrics"
path = "src/main.rs"

[[bin]]
name = "lyrics-whisper"
path = "src/bin/lyrics-whisper.rs"
required-features = ["asr"]

[features]
default = []
asr = ["dep:whisper-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
url = "2"
whisper-rs = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
